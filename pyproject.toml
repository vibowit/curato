[project]
name = "movie-recommend"
version = "0.1.0"
description = "Personal movie and TV show recommendation system based on Simkl, taste profiling, and LLM"
readme = "PRODUCT.md"
requires-python = ">=3.11"
authors = [
    { name = "vibowit" }
]
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
